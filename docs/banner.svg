<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162032" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#cyberGrid)" opacity="0.65"/>

  <!-- Subtle Radial Glow Behind Logo -->
  <circle cx="210" cy="200" r="160" fill="#10b981" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Logo Group -->
  <g transform="translate(90, 80) scale(0.47)">
    <!-- Base Shield -->
    <path d="M256 36 L436 100 V244 C436 360 354 444 256 476 C158 444 76 360 76 244 V100 Z" 
          fill="#0f192c" stroke="#1f2d47" stroke-width="10" stroke-linejoin="round"/>
    <!-- Glowing Outline -->
    <path d="M256 64 L410 120 V240 C410 340 338 418 256 448 C174 418 102 340 102 240 V120 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)"/>
    <!-- Radar Circles -->
    <circle cx="256" cy="240" r="110" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="256" cy="240" r="65" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
    <circle cx="256" cy="240" r="24" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="4"/>
    <circle cx="256" cy="240" r="8" fill="#34d399" filter="url(#neonGlow)"/>
    <!-- Pulse Line -->
    <path d="M120 240 H195 L220 180 L256 310 L292 195 L315 240 H392" 
          fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)"/>
    <!-- Sentinel Nodes -->
    <circle cx="256" cy="64" r="10" fill="#34d399" filter="url(#neonGlow)"/>
    <circle cx="410" cy="120" r="8" fill="#10b981"/>
    <circle cx="102" cy="120" r="8" fill="#10b981"/>
  </g>

  <!-- Typography & Text Content -->
  <g transform="translate(360, 0)">
    <!-- Version Tag -->
    <g transform="translate(0, 105)">
      <rect width="118" height="26" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="59" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">RELEASE v1.0.1</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="180" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">API SENTINEL</text>

    <!-- Tagline -->
    <text x="0" y="222" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Know when your API fails, before your users do.
    </text>

    <!-- Turkish Subtitle -->
    <text x="0" y="254" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      API'niz çökmeden, kullanıcılarınızdan önce haberiniz olsun.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 288)">
      <!-- Badge 1: Real-time Probing -->
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#162032" stroke="#25354e" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#10b981"/>
      <text x="26" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Real-Time Probing</text>

      <!-- Badge 2: SSRF Protected -->
      <rect x="175" y="0" width="145" height="30" rx="8" fill="#162032" stroke="#25354e" stroke-width="1"/>
      <circle cx="189" cy="15" r="4" fill="#06b6d4"/>
      <text x="201" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SSRF Guarded</text>

      <!-- Badge 3: Telegram Alerts -->
      <rect x="335" y="0" width="140" height="30" rx="8" fill="#162032" stroke="#25354e" stroke-width="1"/>
      <circle cx="349" cy="15" r="4" fill="#38bdf8"/>
      <text x="361" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Telegram Alerts</text>

      <!-- Badge 4: Portable Desktop -->
      <rect x="490" y="0" width="155" height="30" rx="8" fill="#162032" stroke="#25354e" stroke-width="1"/>
      <circle cx="504" cy="15" r="4" fill="#a855f7"/>
      <text x="516" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Windows Portable</text>
    </g>
  </g>
</svg>
