<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Shield -->
  <path d="M256 36 L436 100 V244 C436 360 354 444 256 476 C158 444 76 360 76 244 V100 Z" 
        fill="#0d1527" stroke="#1f2d47" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Glowing Shield Outline -->
  <path d="M256 64 L410 120 V240 C410 340 338 418 256 448 C174 418 102 340 102 240 V120 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Radar / Telemetry Grid Circles -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="6,6"/>
  <circle cx="256" cy="240" r="65" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="240" r="24" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="4"/>
  <circle cx="256" cy="240" r="8" fill="#34d399" filter="url(#neonGlow)"/>

  <!-- Pulse / Heartbeat Line in Shield -->
  <path d="M120 240 H195 L220 180 L256 310 L292 195 L315 240 H392" 
        fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Top Satellite Sentinel Node -->
  <circle cx="256" cy="64" r="10" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="410" cy="120" r="8" fill="#10b981"/>
  <circle cx="102" cy="120" r="8" fill="#10b981"/>
</svg>
